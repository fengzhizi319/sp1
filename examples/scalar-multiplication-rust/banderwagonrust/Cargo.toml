[package]
name = "banderwagonrust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

ark-ed-on-bls12-381-bandersnatch = "0.4.0"
ark-ff = { version = "^0.4.2", default-features = false }
ark-ec = { version = "^0.4.2", default-features = false }
ark-serialize = { version = "^0.4.2", default-features = false }
rayon = "*"
hugepage-rs = "0.1.0"

##[target.'cfg(all(target_os = "zkvm", target_arch = "riscv32"))'.dependencies]
#risc0-zkvm-platform = { path = "../../../risc0/zkvm/platform", features = ["unstable", "getrandom"] }
##[target.'cfg(all(target_os = "zkvm", target_arch = "riscv32"))'.dependencies]
#risc0-zkvm = { path = "../../../risc0/zkvm", default-features = false, features = [
#    "std",
#] }

[dev-dependencies]
hex = "0.4.3"
rand_chacha = "0.3.1"

[features]
default = ["parallel"]
parallel = ["ark-ff/parallel", "ark-ff/asm", "ark-ec/parallel"]
